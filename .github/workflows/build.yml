name: Build and Release EMCL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: emcl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_SHA: ${{ github.sha }}
      MICROSOFT_AUTH_ID: ${{ secrets.CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build EMCL.jar (shadowJar)
        run: ./gradlew :HMCL:shadowJar --no-daemon --stacktrace

      - name: Stage EMCL.jar
        shell: bash
        run: |
          mkdir -p staging/app
          cp HMCL/build/libs/HMCL-*.jar staging/app/EMCL.jar
          ls -lh staging/app/EMCL.jar

      - name: Download OpenJFX 21.0.8 Windows jmods
        shell: bash
        run: |
          set -e
          curl -fL --retry 3 -o fxjmods.zip "https://download2.gluonhq.com/openjfx/21.0.8/openjfx-21.0.8_windows-x64_bin-jmods.zip"
          powershell -NoProfile -Command "Expand-Archive -Force -Path 'fxjmods.zip' -DestinationPath 'fxjmods'"
          FXMODS="$(dirname "$(find fxjmods -name 'javafx.controls.jmod' | head -n1)")"
          FXWIN="$(cygpath -w "$FXMODS")"
          echo "FXMODS=$FXMODS"
          echo "FXWIN=$FXWIN"
          echo "FXWIN=$FXWIN" >> "$GITHUB_ENV"
          ls -1 "$FXMODS"

      - name: Build portable Windows app-image with jpackage
        shell: cmd
        run: |
          jpackage --type app-image --name EMCL --dest staging\image --input staging\app ^
            --main-jar EMCL.jar --main-class org.jackhuang.hmcl.Main ^
            --icon EMCL.ico --vendor "ETC Team" --app-version 1.0.0 ^
            --module-path "%FXWIN%" ^
            --add-modules javafx.base,javafx.graphics,javafx.controls ^
            --java-options "-Demcl.packaged=true" ^
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" ^
            --java-options "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED" ^
            --java-options "--add-opens=java.base/jdk.internal.loader=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.base/com.sun.javafx.binding=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.base/com.sun.javafx.event=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.base/javafx.beans.property=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.graphics/javafx.css=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.graphics/javafx.stage=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.graphics/javafx.scene=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.stage=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.util=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.graphics/com.sun.prism=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.controls/com.sun.javafx.scene.control=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.controls/com.sun.javafx.scene.control.behavior=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.controls/javafx.scene.control=ALL-UNNAMED" ^
            --java-options "--add-opens=javafx.controls/javafx.scene.control.skin=ALL-UNNAMED" ^
            --java-options "--add-opens=jdk.attach/sun.tools.attach=ALL-UNNAMED"

      - name: Package portable zip (POSIX separators)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rel = Get-Content "staging/image/EMCL/runtime/release" -Raw
          if ($rel -notmatch 'javafx.graphics' -or $rel -notmatch 'javafx.controls') { throw "javafx modules missing from runtime" }
          Write-Host "javafx modules present in runtime/release"
          $src = (Resolve-Path "staging/image/EMCL").Path
          $zip = Join-Path (Get-Location) "EMCL-windows-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $baseLen = $src.Length + 1
          $fs = [System.IO.File]::Open($zip, [System.IO.FileMode]::CreateNew)
          $arc = New-Object System.IO.Compression.ZipArchive($fs, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            Get-ChildItem -Path $src -Recurse -File | ForEach-Object {
              $entryName = "EMCL/" + $_.FullName.Substring($baseLen).Replace('\','/')
              $entry = $arc.CreateEntry($entryName, [System.IO.Compression.CompressionLevel]::Optimal)
              $out = $entry.Open()
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              $out.Write($bytes, 0, $bytes.Length)
              $out.Dispose()
            }
          } finally { $arc.Dispose(); $fs.Dispose() }
          Write-Host "verifying archive..."
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($z.Entries | ForEach-Object { $_.FullName })
            if (@($names | Where-Object { $_ -match '\\' }).Count -gt 0) { throw "backslash entry found" }
            foreach ($need in @("EMCL/EMCL.exe","EMCL/app/EMCL.jar","EMCL/app/EMCL.cfg")) {
              if ($names -notcontains $need) { throw "missing $need" }
            }
            $fx = @($names | Where-Object { $_ -like "EMCL/runtime/bin/*glass*" -or $_ -like "EMCL/runtime/bin/*javafx*" -or $_ -like "EMCL/runtime/bin/*prism*" })
            if ($fx.Count -eq 0) { throw "javafx native runtime not found" }
            Write-Host ("entries=" + $names.Count + " fxNativeExample=" + $fx[0])
          } finally { $z.Dispose() }
          Get-Item $zip | Select-Object Name,Length

      - name: Build single-file self-extracting EMCL.exe
        shell: cmd
        run: |
          set "SZ=%ProgramFiles%\7-Zip"
          if not exist "%SZ%\7z.exe" (echo 7z.exe not found & exit /b 1)
          if not exist "%SZ%\7zS.sfx" (echo 7zS.sfx not found & exit /b 1)
          pushd staging\image
          "%SZ%\7z.exe" a -t7z -mx=9 -bb0 ..\..\payload.7z EMCL
          popd
          copy /b "%SZ%\7zS.sfx" + installer\sfx_config.txt + payload.7z EMCL.exe
          dir EMCL.exe

      - name: Verify single-file EMCL.exe
        shell: pwsh
        run: |
          $f = Get-Item "EMCL.exe"
          if ($f.Length -lt 30MB) { throw "EMCL.exe suspiciously small: $($f.Length)" }
          $fs = [System.IO.File]::OpenRead($f.FullName)
          $b = New-Object byte[] 2
          $null = $fs.Read($b, 0, 2); $fs.Dispose()
          if (-not ($b[0] -eq 0x4D -and $b[1] -eq 0x5A)) { throw "EMCL.exe is not a PE (MZ) file" }
          Write-Host ("EMCL.exe OK, bytes=" + $f.Length)

      - name: Compile optional EMCLJavaSetup.exe
        id: bootstrap
        continue-on-error: true
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /EHsc /O2 /D_UNICODE /DUNICODE installer\EMCLJavaSetup.cpp /Fe:EMCLJavaSetup.exe /link urlmon.lib user32.lib shell32.lib
          dir EMCLJavaSetup.exe

      - name: Publish / update continuous Release (jar + portable zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: EMCL continuous
          prerelease: true
          make_latest: false
          files: |
            EMCL.exe
            staging/app/EMCL.jar
            EMCL-windows-portable.zip

      - name: Attach optional EMCLJavaSetup.exe (best effort)
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: EMCL continuous
          prerelease: true
          make_latest: false
          files: EMCLJavaSetup.exe

  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage website
        run: |
          mkdir -p _site
          cp -r website/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
