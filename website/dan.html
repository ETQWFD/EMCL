<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMCL Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gate">
  <div class="box panel">
    <h2>EMCL Admin</h2>
    <label>口令</label>
    <input type="password" id="pw" autofocus>
    <p class="msg err" id="pwmsg"></p>
    <div class="row" style="justify-content:center;">
      <button class="btn btn-primary" id="pwbtn">进入</button>
    </div>
  </div>
</div>

<main class="admin" id="main" style="display:none;">
  <h1 style="font-size:22px;margin-bottom:4px;">EMCL Admin</h1>
  <p class="sub" style="text-align:left;margin-bottom:20px;">Release 统计与公告发布。数据来自 GitHub API，下载统计不做服务端去重。</p>

  <div class="panel">
    <h2>Release 统计</h2>
    <table class="t">
      <tr><th>最新版本</th><td id="st-latest">-</td></tr>
      <tr><th>最新版下载量</th><td id="st-latest-dl">-</td></tr>
      <tr><th>近期版本累计下载</th><td id="st-total-dl">-</td></tr>
    </table>
    <h2 style="margin-top:18px;">逐资产下载数</h2>
    <table class="t" id="assets"><tr><th>资产</th><th>下载量</th></tr></table>
  </div>

  <div class="panel">
    <h2>发布公告</h2>
    <label>标题</label>
    <input type="text" id="a-title">
    <label>正文</label>
    <textarea id="a-content"></textarea>
    <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="a-enabled" checked> 启用</label>
    <label>GitHub PAT（可选，仅存内存）</label>
    <input type="password" id="a-pat" placeholder="ghp_...（classic 勾 repo；fine-grained 勾 Contents 读写）">
    <p class="hint">留空可查看公开统计（受每小时 60 次限流）；发布公告必须填写具备 Contents 写权限的令牌，令牌仅用于本次请求，不写入任何存储。</p>
    <div class="row">
      <button class="btn btn-primary" id="pub-btn">发布公告</button>
      <button class="btn btn-ghost" id="refresh-btn">刷新统计</button>
    </div>
    <p class="msg" id="pub-msg"></p>
  </div>
</main>

<script>
(function () {
  var PASS = "1234";
  var REPO = "ETQWFD/EMCL";
  var gate = document.getElementById("gate");
  var main = document.getElementById("main");
  var pwmsg = document.getElementById("pwmsg");

  function enter() {
    if (document.getElementById("pw").value === PASS) {
      sessionStorage.setItem("emcl_admin", "1");
      gate.style.display = "none";
      main.style.display = "block";
      loadStats();
    } else {
      pwmsg.textContent = "口令错误";
    }
  }
  document.getElementById("pwbtn").addEventListener("click", enter);
  document.getElementById("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") enter(); });
  if (sessionStorage.getItem("emcl_admin") === "1") {
    gate.style.display = "none";
    main.style.display = "block";
    loadStats();
  }

  function authHeaders(extra) {
    var h = { "Accept": "application/vnd.github+json" };
    var pat = document.getElementById("a-pat").value.trim();
    if (pat) h["Authorization"] = "token " + pat;
    if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
    return h;
  }

  function loadStats() {
    document.getElementById("st-latest").textContent = "加载中…";
    fetch("https://api.github.com/repos/" + REPO + "/releases?per_page=20", { headers: authHeaders() })
      .then(function (r) {
        if (r.status === 403 || r.status === 429) throw new Error("GitHub 未认证请求限流（每小时 60 次）。在下方填入 PAT 后点刷新统计（额度升至 5000/小时）。");
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (list) {
        if (!Array.isArray(list)) throw new Error((list && list.message) ? list.message : "响应不是数组");
        var latest = list.find(function (r) { return !r.draft; });
        var total = 0, latestDl = 0, rows = "";
        list.forEach(function (rel) {
          var relDl = 0;
          rel.assets.forEach(function (a) {
            relDl += a.download_count;
            rows += "<tr><td>" + a.name + "</td><td>" + a.download_count.toLocaleString() + "</td></tr>";
          });
          total += relDl;
          if (rel === latest) latestDl = relDl;
        });
        document.getElementById("st-latest").textContent = latest ? latest.tag_name : "-";
        document.getElementById("st-latest-dl").textContent = latestDl.toLocaleString();
        document.getElementById("st-total-dl").textContent = total.toLocaleString();
        document.getElementById("assets").innerHTML = "<tr><th>资产</th><th>下载量</th></tr>" + rows;
      })
      .catch(function (e) {
        document.getElementById("st-latest").textContent = "获取失败：" + e.message;
      });
  }
  document.getElementById("refresh-btn").addEventListener("click", loadStats);

  document.getElementById("pub-btn").addEventListener("click", function () {
    var title = document.getElementById("a-title").value.trim();
    var content = document.getElementById("a-content").value.trim();
    var enabled = document.getElementById("a-enabled").checked;
    var pat = document.getElementById("a-pat").value.trim();
    var msg = document.getElementById("pub-msg");
    if (!title || !content) { msg.className = "msg err"; msg.textContent = "标题与正文不能为空"; return; }
    if (!pat) { msg.className = "msg err"; msg.textContent = "请填写 GitHub PAT（仅本次请求使用，不保存）"; return; }
    var api = "https://api.github.com/repos/" + REPO + "/contents/website/announce.json";
    var H = { "Authorization": "token " + pat, "Accept": "application/vnd.github+json" };
    msg.className = "msg"; msg.textContent = "正在获取 announce.json…";
    fetch(api, { headers: H })
      .then(function (r) {
        if (!r.ok) {
          if (r.status === 401 || r.status === 403) throw new Error("PAT 无效或权限不足：需要可写 Contents 的令牌。HTTP " + r.status);
          if (r.status === 404) throw new Error("未找到 announce.json 或 PAT 无该仓库访问权限。HTTP 404");
          throw new Error("读取失败 HTTP " + r.status);
        }
        return r.json();
      })
      .then(function (meta) {
        if (!meta.sha) throw new Error("读取 announce.json 失败：" + (meta.message || "unknown"));
        var body = decodeURIComponent(escape(atob(meta.content.replace(/\s/g, "").replace(/=+$/, ""))));
        var arr;
        try { arr = JSON.parse(body); } catch (e) { arr = []; }
        if (!Array.isArray(arr)) arr = [];
        arr.push({ id: "announce-" + Date.now(), enabled: enabled, title: title, content: content, updated: new Date().toISOString() });
        var payload = {
          message: "Update announce.json",
          content: btoa(unescape(encodeURIComponent(JSON.stringify(arr, null, 2)))),
          sha: meta.sha
        };
        return fetch(api, { method: "PUT", headers: H, body: JSON.stringify(payload) });
      })
      .then(function (r) {
        if (!r.ok) {
          if (r.status === 409) throw new Error("announce.json 有新提交（冲突 409），请稍后重试。");
          if (r.status === 403 || r.status === 401) throw new Error("PAT 没有写入 Contents 的权限。HTTP " + r.status);
          return r.json().then(function (res) { throw new Error(res.message || ("发布失败 HTTP " + r.status)); });
        }
        return r.json();
      })
      .then(function (res) {
        if (res.content) {
          msg.className = "msg ok";
          msg.textContent = "已发布。GitHub Pages 约 1 分钟后生效。";
          document.getElementById("a-title").value = "";
          document.getElementById("a-content").value = "";
        } else {
          throw new Error(res.message || "发布失败");
        }
      })
      .catch(function (e) { msg.className = "msg err"; msg.textContent = e.message; });
  });
})();
</script>
</body>
</html>
